name: Temporary core-next typecheck
on:
  push:
    branches: [feat/app-mode-editor-keyboard]
    paths:
      - '.github/workflows/audit-keyboard.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Review global keyboard listeners
        shell: bash
        run: |
          grep -RnE "keydown|keyup|keypress|onKeyDown|onKeyUp|onKeyPress|KeyboardEvent" src || true
