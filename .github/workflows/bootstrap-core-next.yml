name: One-time core-next migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-core-next.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy source branch and update package metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch chore/scss-modules \
            https://github.com/KrimsonKing1337/activeBook-react-core.git \
            "${RUNNER_TEMP}/source-core"
          rsync -a --delete --exclude='.git' \
            "${RUNNER_TEMP}/source-core/" "./"
          node <<'NODE'
          const fs = require('node:fs');
          const name = 'activebook-react-core-next';
          const version = '0.0.1';
          for (const filename of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(filename, 'utf8'));
            data.name = name;
            data.version = version;
            if (filename === 'package-lock.json') {
              data.packages[''].name = name;
              data.packages[''].version = version;
            }
            fs.writeFileSync(filename, JSON.stringify(data, null, 2) + '\n');
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize core-next from chore/scss-modules"
          git push origin HEAD:main
